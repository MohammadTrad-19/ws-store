<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Admin Contact Messages - WS Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page admin-contact-page">

  <header class="admin-navbar">

    <div class="admin-logo-box">
      <img src="images/ws logo.png"
           alt="WS Store Logo"
           class="admin-logo">
    </div>

    <nav class="admin-nav-links">

      <button onclick="window.location.href='admin.html'">
        Dashboard
      </button>

      <button onclick="window.location.href='admin-products.html'">
        Manage Products
      </button>

      <button onclick="window.location.href='admin-orders.html'">
        View Orders
      </button>
      <button onclick="window.location.href='admin-stock.html'">Stock By Size</button>

      <button onclick="window.location.href='admin-contact.html'">
        Contact Messages
      </button>

      <button onclick="window.location.href='admin-reviews.html'">
        Customer Reviews
      </button>
      <button onclick="window.location.href='admin-chatbot.html'">Chatbot Messages</button>

      <button class="admin-nav-logout"
              onclick="logoutAdmin()">
        Logout
      </button>

    </nav>

  </header>

  <section class="admin-content-section">

    <h1 class="admin-section-title">
      Contact Messages
    </h1>

    <div class="contact-page-wrapper">

      <div id="contactMessagesContainer"
           class="contact-messages-grid"></div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
