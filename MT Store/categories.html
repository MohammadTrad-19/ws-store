<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - WS Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <img src="images/ws logo.png" class="logo" alt="WS Store Logo">

        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="home.html#about">About</a></li>
                <li><a href="home.html#contact">Contact</a></li>
                <li><a href="products.html" onclick="clearProductFilters()">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li id="logoutItem" style="display: none;">
    <a href="#" class="logout-link" onclick="logoutUser()" title="Logout">
        <svg class="logout-icon" viewBox="0 0 24 24">
            <path d="M10 17l5-5-5-5v3H3v4h7v3z"/>
            <path d="M19 3H11a2 2 0 00-2 2v3h2V5h8v14h-8v-3H9v3a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2z"/>
        </svg>
    </a>
</li>
            </ul>
        </nav>
    </header>

    <section class="categories-page">
        <h1>Shop by Sport</h1>

        <div class="categories-container">
            <div class="category-card" onclick="selectCategory('Football')">
                <img src="images/messi-adidas.jpg" alt="Football">
                <h3>Football</h3>
            </div>

            <div class="category-card" onclick="selectCategory('Basketball')">
                <img src="images/Stephen Curry.webp" alt="Basketball">
                <h3>Basketball</h3>
            </div>

            <div class="category-card" onclick="selectCategory('Volleyball')">
                <img src="images/Earvin N'Gapeth.jpg" alt="Volleyball">
                <h3>Volleyball</h3>
            </div>

            <div class="category-card" onclick="selectCategory('Tennis')">
                <img src="images/Rafael Nadal.jpg" alt="Tennis">
                <h3>Tennis</h3>
            </div>

            <div class="category-card" onclick="selectCategory('Running')">
                <img src="images/Running.jpg" alt="Running">
                <h3>Running</h3>
            </div>

            <div class="category-card" onclick="selectCategory('Gym')">
                <img src="images/gym.jpg" alt="Gym">
                <h3>Gym</h3>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
